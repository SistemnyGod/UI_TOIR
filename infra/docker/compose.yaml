x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  migrate:
    image: docker-api:latest
    container_name: patrol360-migrate
    entrypoint: ["dotnet", "Patrol360.Api.dll", "--migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      WebCors__AllowedOrigins__0: ${WEB_CORS_ALLOWED_ORIGIN:-https://192.168.2.194}
      ConnectionStrings__Patrol360: Host=postgres;Port=5432;Database=${POSTGRES_DB:-patrol360};Username=${POSTGRES_USER:-patrol360};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DataProtection__KeyRingPath: /var/lib/patrol360/data-protection-keys
      Patrol360__BootstrapAdminPassword: ${PATROL360_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ./secrets/data-protection-keys:/var/lib/patrol360/data-protection-keys
    logging: *default-logging
    profiles:
      - app

  api:
    image: docker-api:latest
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    container_name: patrol360-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Patrol360: Host=postgres;Port=5432;Database=${POSTGRES_DB:-patrol360};Username=${POSTGRES_USER:-patrol360};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DataProtection__KeyRingPath: /var/lib/patrol360/data-protection-keys
      MobileDiagnostics__StoragePath: /app/mobile-diagnostics
      Patrol360__Mobile__AppUpdates__ReleaseDirectory: /app/mobile-releases
      Patrol360__Mobile__AppUpdates__MinimumVersionCode: ${PATROL360_MOBILE_MIN_VERSION_CODE:-0}
      Features__PpeIssueDocuments: ${PPE_ISSUE_DOCUMENTS_ENABLED:-false}
      WebCors__AllowedOrigins__0: ${WEB_CORS_ALLOWED_ORIGIN:-https://192.168.2.194}
      # Must match the proxy address below; all other X-Forwarded-* senders are ignored.
      ForwardedHeaders__KnownProxies__0: ${PATROL360_PROXY_IP:-172.30.0.10}
    volumes:
      - ./secrets/data-protection-keys:/var/lib/patrol360/data-protection-keys
      - api-mobile-files:/app/mobile-files
      - ./mobile-diagnostics:/app/mobile-diagnostics
      - ./mobile-releases:/app/mobile-releases:ro
    networks:
      - default
      - printing
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging: *default-logging
    profiles:
      - app

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: patrol360-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    profiles:
      - app

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    container_name: patrol360-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Patrol360: Host=postgres;Port=5432;Database=${POSTGRES_DB:-patrol360};Username=${POSTGRES_USER:-patrol360};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DataProtection__KeyRingPath: /var/lib/patrol360/data-protection-keys
      Firebase__ServiceAccountPath: /run/secrets/firebase-service-account.json
    volumes:
      - ./secrets/data-protection-keys:/var/lib/patrol360/data-protection-keys
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/patrol360-worker-heartbeat.json && find /tmp/patrol360-worker-heartbeat.json -mmin -3 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    profiles:
      - app

  proxy:
    image: caddy:2.8-alpine
    container_name: patrol360-proxy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "5173:80"
    networks:
      default:
        # Keep this synchronized with ForwardedHeaders__KnownProxies__0 on api.
        ipv4_address: ${PATROL360_PROXY_IP:-172.30.0.10}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs/patrol360.local.crt:/etc/caddy/certs/patrol360.local.crt:ro
      - ./certs/patrol360.local.key:/etc/caddy/certs/patrol360.local.key:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider -T 5 http://127.0.0.1/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 10s
    logging: *default-logging
    profiles:
      - app

  postgres:
    image: postgres:17-alpine
    container_name: patrol360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patrol360}
      POSTGRES_USER: ${POSTGRES_USER:-patrol360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  gotenberg:
    build:
      context: ../..
      dockerfile: infra/docker/gotenberg/Dockerfile
    container_name: patrol360-gotenberg
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=60s"]
    mem_limit: ${GOTENBERG_MEM_LIMIT:-1g}
    cpus: ${GOTENBERG_CPUS:-2}
    networks: [printing]
    logging: *default-logging
    profiles: [ppe-printing]

volumes:
  api-mobile-files:
  postgres-data:
  minio-data:

networks:
  printing:
    internal: true
  default:
    ipam:
      config:
        - subnet: ${PATROL360_DOCKER_SUBNET:-172.30.0.0/24}
